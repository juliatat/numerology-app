<div class="calendar-container">
  <mat-card>
    <mat-card-title>
      {{ 'PROGNOSTICS.CALENDAR_TITLE' | translate }} — {{ month() }}/{{ year() }}
    </mat-card-title>

    <mat-card-content class="calendar-grid-wrapper">
      <mat-grid-list cols="7" [rowHeight]="rowHeight()" [gutterSize]="gutterSize()">
        @for (day of days(); track trackByDay(day)) {
          <mat-grid-tile [class.today]="day.day === todayDay()">
            <div class="day-number">{{ day.day }}</div>
            <div class="day-arcane">
              {{ 'PROGNOSTICS.ARCANE' | translate }} <br> {{ day.arcane }}
            </div>
          </mat-grid-tile>
        }
      </mat-grid-list>
    </mat-card-content>
  </mat-card>
</div>
