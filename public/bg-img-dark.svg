<svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <style>
      .circle {
        fill: none;
        stroke: #bcbecc;
        stroke-width: 1.2;
        opacity: 0.08;
      }
      .number {
        font-family: 'Montserrat', sans-serif;
        font-weight: 200;
        fill: #bcbecc;
        opacity: 0.04;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#21252e" />

  <!-- Soft geometric circles -->
  <circle class="circle" cx="720" cy="450" r="300"/>
  <circle class="circle" cx="720" cy="450" r="180"/>
  <circle class="circle" cx="720" cy="450" r="60"/>
  <circle class="circle" cx="300" cy="200" r="120"/>
  <circle class="circle" cx="1100" cy="700" r="160"/>

  <!-- Floating numbers -->
  <text class="number" x="150" y="250" font-size="180">3</text>
  <text class="number" x="1200" y="200" font-size="220">7</text>
  <text class="number" x="500" y="750" font-size="160">9</text>
  <text class="number" x="1000" y="600" font-size="140">1</text>
  <text class="number" x="250" y="700" font-size="200">6</text>
</svg>
